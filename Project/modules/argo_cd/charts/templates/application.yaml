apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.application.name }}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: {{ .Values.application.repoURL }}
    targetRevision: {{ .Values.application.targetRevision }}
    path: {{ .Values.application.path }}
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: {{ .Values.application.destination.server }}
    namespace: {{ .Values.application.destination.namespace }}

  syncPolicy:
    automated:
      prune: true       # удаляет ресурсы которых нет в git
      selfHeal: true    # возвращает в норму если кто-то изменил вручную
    syncOptions:
      - CreateNamespace=true
