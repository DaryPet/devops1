global:
  image:
    tag: "v2.10.0"

server:
  # LoadBalancer — даёт внешний IP для доступа к UI
  service:
    type: LoadBalancer

  # Отключаем TLS для простоты (в продакшне — включить)
  insecure: true

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

configs:
  params:
    # Разрешаем работу без TLS
    server.insecure: true

  # Настройки автосинхронизации по умолчанию
  cm:
    application.resourceTrackingMethod: annotation

repoServer:
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

applicationSet:
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"

notifications:
  enabled: false
