replicaCount: 2

image:
  repository: 453767499372.dkr.ecr.us-east-1.amazonaws.com/lesson-5-ecr
  tag: latest
  pullPolicy: Always

service:
  type: LoadBalancer
  port: 8000
  targetPort: 8000

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

config:
  DEBUG: "False"
  ALLOWED_HOSTS: "*"
  POSTGRES_HOST: "your-postgres-host"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "your-db-name"
  POSTGRES_USER: "your-user"
  POSTGRES_PASSWORD: "your-password"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"